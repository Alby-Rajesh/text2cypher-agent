[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "text2cypher-agent"
version = "1.0.0"
description = "Agentic Text-to-Cypher over Neo4j with LangGraph, a QLoRA fine-tuned model, Redis and LangSmith"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alby Rajesh" }]
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-redis>=0.5",
    "langchain-core>=1.7",
    "langchain-openai>=1.7",
    "langsmith>=0.14",
    "neo4j>=5.20",
    "redis>=6.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
data = ["datasets>=3.0"]
finetune = ["datasets>=3.0", "trl>=1.16", "peft>=0.21", "bitsandbytes>=0.45", "accelerate>=1.0", "torch>=2.4"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
text2cypher = "text2cypher.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/text2cypher"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
